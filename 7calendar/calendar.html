<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body {
font-family:Arial,sans-serif;
text-align:center;
}
table{
margin:20px auto;
border-collapse:collapse;
}
th,td{
border:1px solid #ddd;
padding:10px;
}
th{
background-color:#f2f2f2;}
td
{cursor:pointer;
}
td.sunday,td.second-saturday{
color:red;
}
td.second-saturday{
font-weight:bold;
}
</style>
</head>
<body>
<h2>Calendar Generator</h2>
<label for="year">enter year:</label>
<input type="number"id="year"placeholder="enter year" min="1900"max="2100">
<label for="month">enter month:</label>
<input type="number"id="month"placeholder="enter month"min="1"max="12">
<button onclick="generateCalendar()">Generate Calendar</button>
<div id="calendar-container"></div>
<script>
function generateCalendar(){
const year=Number(document.getElementById('year').value);
const month=Number(document.getElementById('month').value);
if(!year || !month){
alert('please enter both year and month.');
return;
}
const daysInMonth=new Date(year,month,0).getDate();
const firstDay=new Date(year,month -1,1).getDay();
let calendarHTML = '<table>';
calendarHTML+='<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>';
let day=1;
for(let i=0;i<6;i++){
calendarHTML+='<tr>';
for(let j=0;j<7;j++){
if((i===0 && j<firstDay)||day>daysInMonth){
calendarHTML +='<td></td>';
}else{const currentDate = new Date(year, month-1, day);
let classname='';
if(j===0){
classname='sunday';
}
if(j===6 && Math.ceil(day/7)=== 2){
classname='second-saturday';
}
calendarHTML += '<td class="' + classname + '" onclick="alert(\'you clicked on' + currentDate.toDateString()+'\')">' + day + '</td>';
day++
}
}

calendarHTML+='</tr>';
if(day>daysInMonth) break;
}
calendarHTML+='</table>';
document.getElementById('calendar-container').innerHTML=calendarHTML;
}
</script>
</body>
</html>
