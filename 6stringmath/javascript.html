<h1>STRING METHOD</h1>
<script>
let s="iam fida";
document.write("java script string method<br>");
document.write("iam fida<br>");
document.write("length of string:"+s.length+"<br>");
document.write("index of first of occurence of 'a' in a string:"+s.indexOf ("a")+"<br");
document.write("index of last occurence of a in string is:"+s.lastIndexOf ("a")+"<br>");
document.write("index of am in string:"+s.indexOf("am")+"<br>");
document.write("index 0 to 3 print using slice:"+s.slice(0,4)+"<br>");
document.write("to get substring using substring:"+s.substring(0,9)+"<br>");
document.write("to get substring using substr:"+s.substr(0,1)+"<br>");
document.write("string to uppercase:"+s.toUpperCase()+"<br>");
document.write("replace fida to devangana in string:"+s.replace("fida","devangana")+"<br>");
document.write("use trim:"+s.trim()+"<br>");
document.write("new string that have character 5 on string:"+s.charAt(5)+"<br>");
document.write("print numeric ASSI value of character 5 on string:"+s.chaqrCodeAt(5)+"<br>");
</script>
<h1>MATH OBJECT</h1>
<script>
document.write("math object is a build in object,contains basic mathematical functions and constants<br><br>");
document.write("value of p1 in radian"+Math.PI+"<br>");
document.write("PI in degree:"+(Math.PI*180/Math.PI)+"<br");
document.write("value of E:"+Math.E+"<br>");
document.write("sign of -3:"+Math.sign(-3)+"<br>");
document.write("square root of a number 8 is:"+Math.sqrt(8)+"<br>");
document.write("the second power of 8 is:"+Math.pow(8,2)+"<br>");
document.write("round the value 6.7 is:"+Math.round(6.7)+"<br>");
document.write("round the value 4.6 is:"+Math.round (4.6)+"<br>");
document.write("ceil the value 4.4 is:"+Math.ceil(4.4)+"<br>");
document.write("ceil the value 4.6 is:"+Math.ceil(4.6)+"<br>");
document.write("floor the value of the value 4.4 is:"+Math.floor(4.4)+"<br>");
</script>
